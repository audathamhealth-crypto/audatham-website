    <meta name="theme-color" content="#ffffff" />

    <!-- SEO Title -->
    <title>AUDATHAM — Pure, Wild, Unfiltered Honey | Tamil Nadu Farm Foods</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Discover raw honey, traditional malts and natural sweeteners from AUDATHAM, our family farm in the Cauvery delta, Tamil Nadu. Rooted in tradition since 1984."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="AUDATHAM, raw honey Tamil Nadu, pure honey, natural honey, wild honey, farm honey, Cauvery delta honey, traditional malts, health malts, natural sweeteners, Tamil Nadu farm foods"

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->

    />

    <!-- Google Search Console Verification -->
